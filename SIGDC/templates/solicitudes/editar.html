<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Editar solicitud - SIGDC</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  </head>
  <body class="bg-light">
    <main class="container py-4">
      <h3>Editar solicitud #{{ s.id }}</h3>
      <form method="post">
        {% csrf_token %}
        <div class="mb-3">
          <label class="form-label">Título</label>
          <input name="titulo" class="form-control" value="{{ s.titulo }}" />
        </div>
        <div class="mb-3">
          <label class="form-label">Detalle</label>
          <textarea name="detalle" class="form-control">{{ s.detalle }}</textarea>
        </div>
        <div class="mb-3">
          <label class="form-label">Cantidad</label>
          <input name="cantidad" type="number" class="form-control" value="{{ s.cantidad }}" />
        </div>
        <button class="btn btn-primary" type="submit">Guardar</button>
        <a href="{% url 'solicitudes:detalle' s.pk %}" class="btn btn-secondary">Cancelar</a>
      </form>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
