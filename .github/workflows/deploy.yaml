name: CI/CD Deploy SIGDC

on:
  push:
    branches:
      - kikin3

jobs:
  deploy:
    runs-on: self-hosted

    steps:

      # Checkout del código
      - name: Checkout del código
        uses: actions/checkout@v3

      # Copiar proyecto al servidor sin borrar env, static, socket ni settings
      - name: Copiar proyecto al servidor sin borrar env ni static ni settings
        run: |
          sudo rsync -av --delete \
            --exclude env/ \
            --exclude static/ \
            --exclude SIGDC.sock \
            --exclude SIGDC/settings.py \
            /home/kikin/actions-runner/_work/SIGDC/SIGDC/ \
            /home/kikin/sites/SIGDC/

      # Crear entorno virtual si no existe
      - name: Crear entorno virtual si no existe
        run: |
          if [ ! -d "/home/kikin/sites/SIGDC/env" ]; then
            python3 -m venv /home/kikin/sites/SIGDC/env
          fi

      # Instalar dependencias usando el entorno virtual
      - name: Instalar dependencias
        run: |
          set -e
          /home/kikin/sites/SIGDC/env/bin/pip install --upgrade pip
          /home/kikin/sites/SIGDC/env/bin/pip install -r /home/kikin/sites/SIGDC/requirements.txt

      # Ejecutar migraciones (RUTA CORREGIDA)
      - name: Migraciones
        run: |
          set -e
          /home/kikin/sites/SIGDC/env/bin/python /home/kikin/sites/SIGDC/SIGDC/manage.py migrate --noinput

      # Recolectar archivos estáticos (RUTA CORREGIDA)
      - name: Archivos estáticos
        run: |
          set -e
          /home/kikin/sites/SIGDC/env/bin/python /home/kikin/sites/SIGDC/SIGDC/manage.py collectstatic --noinput

      # Ajustar permisos
      - name: Ajustar permisos
        run: |
          sudo chown -R kikin:kikin /home/kikin/sites/SIGDC/

      # Reiniciar servicios
      - name: Reiniciar servicios
        run: |
          set -e
          echo "Deploy exitoso. Reiniciando Gunicorn y Nginx..."
          sudo systemctl restart gunicorn_sigdc
          sudo systemctl restart nginx
